<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Student Registration System</h1>
            <p>Manage student registration status</p>
        </header>
        <!-- Dashboard -->
        <section class="dashboard">
            <div class="card">
                <h3>Total Students</h3>
                <p id="totalCount">0</p>
            </div>
            <div class="card done">
                <h3>Done</h3>
                <p id="doneCount">0</p>
            </div>
            <div class="card pending">
                <h3>Pending</h3>
                <p id="pendingCount">0</p>
            </div>
            <div class="card cancelled">
                <h3>Cancelled</h3>
                <p id="cancelledCount">0</p>
            </div>
        </section>
        <!-- Add Student -->
        <section class="form-section">
            <h2>Register New Student</h2>
            <form id="studentForm">
                <input
                    type="text"
                    id="studentId"
                    placeholder="Student ID"
                    required
                >
                <input
                    type="text"
                    id="studentName"
                    placeholder="Student Name"
                    required
                >
                <input
                    type="text"
                    id="course"
                    placeholder="Course"
                    required
                >
                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >
                <input
                    type="date"
                    id="date"
                    required
                >
                <select id="payment">
                    <option value="Paid">Paid</option>
                    <option value="Pending">Pending</option>
                    <option value="Refunded">Refunded</option>
                </select>
                <select id="status">
                    <option value="Done">Done</option>
                    <option value="Pending">Pending</option>
                    <option value="Cancelled">Cancelled</option>
                </select>
                <button type="submit">
                    Add Student
                </button>
            </form>
        </section>
        <!-- Search and Filter -->
        <section class="controls">
            <input
                type="text"
                id="search"
                placeholder="Search by ID or name..."
            >
            <select id="statusFilter">
                <option value="All">All Status</option>
                <option value="Done">
                    Done
                </option>
                <option value="Pending">
                    Pending
                </option>
                <option value="Cancelled">
                    Cancelled
                </option>
            </select>
        </section>
        <!-- Student Table -->
        <section class="table-section">
            <h2>Student Registrations</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Course</th>
                        <th>Email</th>
                        <th>Date</th>
                        <th>Payment</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="studentTable">
                </tbody>
            </table>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
