<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="heading">
            <span class="tag">JavaScript Practical</span>
            <h1>Registration Form</h1>
            <p class="subtitle">Event Handling &amp; Live Form Validation</p>
        </div>

        <form id="registrationForm" novalidate>

            <!-- Name fields -->
            <div class="row-two">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" placeholder="Enter first name" autocomplete="off">
                    <span class="error" id="firstNameError"></span>
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" placeholder="Enter last name" autocomplete="off">
                    <span class="error" id="lastNameError"></span>
                </div>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="name@example.com" autocomplete="off">
                <span class="error" id="emailError"></span>
            </div>

            <!-- Birthday -->
            <div class="form-group">
                <label for="birthday">Birthday</label>
                <input type="date" id="birthday">
                <span class="error" id="birthdayError"></span>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password">
                <div class="strength" id="strength">
                    <div class="strength-bar"><span id="strengthFill"></span></div>
                    <small id="strengthText"></small>
                </div>
                <span class="error" id="passwordError"></span>
            </div>

            <!-- Re-enter Password -->
            <div class="form-group">
                <label for="confirmPassword">Re-enter Password</label>
                <input type="password" id="confirmPassword" placeholder="Re-enter password">
                <span class="error" id="confirmPasswordError"></span>
            </div>

            <!-- Terms -->
            <div class="terms">
                <input type="checkbox" id="terms">
                <label for="terms">I agree to the Terms and Conditions</label>
            </div>
            <span class="error" id="termsError"></span>

            <!-- Submit -->
            <button type="submit">Register</button>

            <div id="successMessage" class="success"></div>

        </form>

    </div>

    <script src="script.js"></script>
</body>
</html>
