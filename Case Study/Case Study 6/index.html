<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Operations using JavaScript</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="banner">
        <span class="tag">JavaScript Practical</span>
        <h1>JavaScript String Operations</h1>
        <p>Length, case conversion, searching, splitting, replacing, reversing and counting vowels.</p>
    </header>

    <main class="container">

        <!-- 1. Basic String Operations -->
        <section class="card">
            <h2><span class="num">1</span> Basic String Operations</h2>
            <input type="text" id="basicString" placeholder="Enter a string">
            <button id="basicBtn">Perform Operations</button>
            <div id="basicOutput" class="output"></div>
        </section>

        <!-- 2. String Methods -->
        <section class="card">
            <h2><span class="num">2</span> String Methods</h2>
            <div class="field-grid">
                <input type="text" id="methodString" placeholder="Enter a string">
                <input type="text" id="searchText" placeholder="Text to search">
                <input type="text" id="replaceText" placeholder="Text to replace">
                <input type="text" id="replacement" placeholder="Replacement text">
            </div>
            <button id="methodBtn">Apply Methods</button>
            <div id="methodOutput" class="output"></div>
        </section>

        <!-- 3. Reverse a String -->
        <section class="card">
            <h2><span class="num">3</span> Reverse a String</h2>
            <input type="text" id="reverseInput" placeholder="Enter a string">
            <button id="reverseBtn">Reverse</button>
            <div id="reverseOutput" class="output"></div>
        </section>

        <!-- 4. Count Vowels -->
        <section class="card">
            <h2><span class="num">4</span> Count Vowels in a Paragraph</h2>
            <textarea id="paragraphInput" placeholder="Enter a paragraph"></textarea>
            <button id="vowelBtn">Count Vowels</button>
            <div id="vowelOutput" class="output"></div>
        </section>

    </main>

    <footer>String Operations Practical &middot; HTML, CSS &amp; JavaScript</footer>

    <script src="script.js"></script>
</body>
</html>
